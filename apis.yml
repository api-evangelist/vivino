description: Vivino is the world's largest online wine marketplace and wine-discovery
  mobile app, founded in 2010 in Copenhagen, Denmark by Heini Zachariassen and Theis
  Sondergaard. Users scan a wine label to get community ratings, reviews, and tasting
  notes drawn from a database of more than 15 million wines and tens of millions of
  members, and can buy wine directly through the integrated marketplace. As of an
  enrichment pass on 2026-07-21, Vivino does not publish an official public API or
  developer portal (the former developer.vivino.com subdomain 301-redirects to the
  main site), so this profile carries identity and domain-security signals only.
